<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loaders</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%228%22 stroke-dasharray=%22150 100%22><animateTransform attributeName=%22transform%22 type=%22rotate%22 from=%220 50 50%22 to=%22360 50 50%22 dur=%221s%22 repeatCount=%22indefinite%22/></circle></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0a;
    --surface: #121212;
    --surface-2: #1a1a1a;
    --border: rgba(255, 255, 255, 0.08);
    --text: #e8e8e8;
    --text-dim: #9a9a9a;
    --accent: #7c9cff;
    --accent-pink: #ff7ca8;
    --accent-teal: #5fe0c8;
    --accent-orange: #ffb86b;
    --accent-purple: #c792ea;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
    user-select: none;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  /* ========== TOP NAV BAR ========== */
  .topbar {
    flex-shrink: 0;
    height: 60px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: thin;
    z-index: 10;
    position: relative;
  }

  .topbar::-webkit-scrollbar { height: 4px; }
  .topbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }

  .brand {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.5px;
    margin-right: 12px;
    padding-right: 16px;
    border-right: 1px solid var(--border);
    color: var(--text);
    flex-shrink: 0;
  }

  .nav-btn {
    flex-shrink: 0;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-dim);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
    white-space: nowrap;
    letter-spacing: 0.2px;
  }

  .nav-btn:hover {
    background: rgba(255, 255, 255, 0.04);
    color: var(--text);
  }

  .nav-btn.active {
    background: var(--surface-2);
    color: var(--text);
    border-color: var(--border);
  }

  /* ========== MAIN VIEWPORT ========== */
  .viewport {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  .page {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: var(--bg);
  }

  .page.active { display: flex; }

  /* ========== WELCOME PAGE ========== */
  .welcome {
    background:
      radial-gradient(circle at 25% 30%, rgba(124, 156, 255, 0.10), transparent 50%),
      radial-gradient(circle at 75% 70%, rgba(255, 124, 168, 0.08), transparent 55%),
      var(--bg);
    text-align: center;
    padding: 32px;
  }

  .welcome h1 {
    font-size: clamp(32px, 6vw, 56px);
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #fff 0%, #9ab0ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .welcome p {
    color: var(--text-dim);
    font-size: 16px;
    max-width: 520px;
    line-height: 1.6;
    margin-bottom: 32px;
  }

  .welcome .hint-row {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: 0.3px;
  }

  .welcome .arrow {
    width: 20px;
    height: 20px;
    border-left: 2px solid var(--text-dim);
    border-top: 2px solid var(--text-dim);
    transform: rotate(45deg);
    animation: bounceUp 1.6s ease-in-out infinite;
  }

  @keyframes bounceUp {
    0%, 100% { transform: rotate(45deg) translate(0, 0); }
    50%      { transform: rotate(45deg) translate(-3px, -3px); }
  }

  /* ========== LOADER PAGE COMMON ========== */
  .loader-page {
    flex-direction: column;
    gap: 32px;
    position: relative;
  }

  .loader-host {
    width: 120px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .loader-label {
    color: var(--text-dim);
    font-size: 14px;
    letter-spacing: 0.5px;
    min-height: 20px;
  }

  .loader-label .dots::after {
    content: '';
    animation: dots 1.5s steps(4, end) infinite;
  }

  @keyframes dots {
    0%   { content: ''; }
    25%  { content: '.'; }
    50%  { content: '..'; }
    75%  { content: '...'; }
    100% { content: ''; }
  }

  /* ========== LOADER 1: SPINNER (dual ring) ========== */
  .spinner {
    width: 100%; height: 100%;
    position: relative;
  }
  .spinner::before, .spinner::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 5px solid transparent;
  }
  .spinner::before {
    border-top-color: #fff;
    border-right-color: rgba(255, 255, 255, 0.3);
    animation: spin 1.2s linear infinite;
  }
  .spinner::after {
    inset: 18px;
    border-top-color: rgba(255, 255, 255, 0.7);
    border-left-color: rgba(255, 255, 255, 0.2);
    animation: spin 0.8s linear infinite reverse;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ========== LOADER 2: BOUNCING DOTS ========== */
  .dots-loader {
    display: flex;
    gap: 14px;
    align-items: center;
  }
  .dots-loader span {
    width: 16px;
    height: 16px;
    background: var(--accent-pink);
    border-radius: 50%;
    animation: bounce 1.1s ease-in-out infinite;
  }
  .dots-loader span:nth-child(2) { animation-delay: 0.18s; }
  .dots-loader span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-22px); }
  }

  /* ========== LOADER 3: PULSING RING ========== */
  .pulse-loader {
    width: 100%; height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pulse-loader::before, .pulse-loader::after, .pulse-loader > .ring {
    content: '';
    position: absolute;
    border: 2px solid var(--accent-teal);
    border-radius: 50%;
    width: 100%;
    height: 100%;
    animation: pulse 2s linear infinite;
    opacity: 0;
  }
  .pulse-loader::before { animation-delay: 0s; }
  .pulse-loader > .ring { animation-delay: 0.66s; }
  .pulse-loader::after { animation-delay: 1.33s; }
  .pulse-loader .core {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent-teal);
    box-shadow: 0 0 16px rgba(95, 224, 200, 0.6);
    z-index: 1;
  }
  @keyframes pulse {
    0%   { transform: scale(0.2); opacity: 1; }
    100% { transform: scale(1);   opacity: 0; }
  }

  /* ========== LOADER 4: AUDIO BARS ========== */
  .bars-loader {
    display: flex;
    gap: 6px;
    align-items: center;
    height: 80px;
  }
  .bars-loader span {
    display: block;
    width: 10px;
    background: var(--accent-orange);
    border-radius: 4px;
    animation: barPulse 1s ease-in-out infinite;
  }
  .bars-loader span:nth-child(1) { animation-delay: 0.0s; animation-duration: 1.0s; }
  .bars-loader span:nth-child(2) { animation-delay: 0.2s; animation-duration: 0.7s; }
  .bars-loader span:nth-child(3) { animation-delay: 0.4s; animation-duration: 1.2s; }
  .bars-loader span:nth-child(4) { animation-delay: 0.1s; animation-duration: 0.6s; }
  .bars-loader span:nth-child(5) { animation-delay: 0.3s; animation-duration: 0.9s; }
  @keyframes barPulse {
    0%, 100% { height: 15%; }
    50%      { height: 100%; }
  }

  /* ========== LOADER 5: ORBIT ========== */
  .orbit-loader {
    width: 100%; height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .orbit-track {
    position: absolute;
    width: 100%; height: 100%;
    border: 2px solid rgba(199, 146, 234, 0.2);
    border-radius: 50%;
  }
  .orbit-loader .core {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--text);
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    z-index: 2;
  }
  .orbit-arm {
    position: absolute;
    width: 100%; height: 100%;
    animation: spin 1.5s linear infinite;
  }
  .orbit-arm .planet {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent-purple);
    box-shadow: 0 0 14px rgba(199, 146, 234, 0.7);
  }

  /* ========== LOADER 6: MORPH (slow shape-shifter) ========== */
  .morph-loader {
    width: 80px;
    height: 80px;
    background: var(--accent-blue);
    box-shadow: 0 0 30px rgba(124, 156, 255, 0.4);
    animation: morph 4s ease-in-out infinite;
  }
  @keyframes morph {
    0%, 100% {
      border-radius: 8px;
      transform: rotate(0deg);
      background: var(--accent-blue);
    }
    25% {
      border-radius: 50%;
      transform: rotate(90deg);
      background: var(--accent-pink);
    }
    50% {
      border-radius: 8px;
      transform: rotate(180deg);
      background: var(--accent-teal);
    }
    75% {
      border-radius: 50%;
      transform: rotate(270deg);
      background: var(--accent-purple);
    }
  }

  /* ========== BLANK PAGE ========== */
  .blank-page {
    background: #ffffff !important;
  }

  /* ========== MOON SCENE OVERLAY ========== */
  .night-scene {
    position: absolute;
    inset: 0;
    opacity: 0;
    visibility: hidden;
    transition: opacity 1.5s ease, visibility 1.5s ease;
    background: radial-gradient(ellipse at center, #0c1442 0%, #050714 70%, #02030a 100%);
    pointer-events: none;
  }
  .night-scene.visible {
    opacity: 1;
    visibility: visible;
  }

  .moon {
    position: absolute;
    top: 50%; left: 50%;
    width: 140px; height: 140px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fffbe6 0%, #f5e9b8 40%, #d4c283 75%, #a89868 100%);
    box-shadow:
      0 0 60px rgba(255, 248, 200, 0.4),
      0 0 120px rgba(255, 248, 200, 0.2),
      inset -15px -15px 40px rgba(0, 0, 0, 0.25);
    animation: moonFloat 6s ease-in-out infinite;
  }
  .moon::before, .moon::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.08);
  }
  .moon::before {
    width: 22px; height: 22px;
    top: 30%; left: 55%;
    box-shadow:
      -30px 20px 0 -4px rgba(0, 0, 0, 0.07),
      10px 35px 0 -2px rgba(0, 0, 0, 0.06);
  }
  .moon::after {
    width: 14px; height: 14px;
    top: 60%; left: 30%;
    box-shadow: 25px -10px 0 -2px rgba(0, 0, 0, 0.06);
  }
  @keyframes moonFloat {
    0%, 100% { transform: translate(-50%, -50%); }
    50%      { transform: translate(-50%, calc(-50% - 10px)); }
  }

  .star {
    position: absolute;
    width: 4px; height: 4px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 6px 1px rgba(255, 255, 255, 0.8);
    animation: twinkle 2.5s ease-in-out infinite;
  }
  .star::before, .star::after {
    content: '';
    position: absolute;
    background: rgba(255, 255, 255, 0.6);
  }
  .star::before {
    width: 16px; height: 1px;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }
  .star::after {
    width: 1px; height: 16px;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }
  .star:nth-child(2) { top: 18%; left: 22%; animation-delay: 0s;   }
  .star:nth-child(3) { top: 28%; left: 78%; animation-delay: 0.6s; }
  .star:nth-child(4) { top: 70%; left: 15%; animation-delay: 1.2s; }
  .star:nth-child(5) { top: 80%; left: 72%; animation-delay: 1.8s; }
  .star:nth-child(6) { top: 12%; left: 50%; animation-delay: 0.9s; }

  @keyframes twinkle {
    0%, 100% { opacity: 0.4; transform: scale(0.85); }
    50%      { opacity: 1;   transform: scale(1.15); }
  }
</style>
</head>
<body>

  <!-- ===== Top navigation bar ===== -->
  <nav class="topbar" role="navigation">
    <div class="brand">Loaders</div>
    <button class="nav-btn active" data-target="home">Home</button>
    <button class="nav-btn" data-target="spinner">Spinner</button>
    <button class="nav-btn" data-target="dots">Bouncing Dots</button>
    <button class="nav-btn" data-target="pulse">Pulsing Ring</button>
    <button class="nav-btn" data-target="bars">Audio Bars</button>
    <button class="nav-btn" data-target="orbit">Orbit</button>
    <button class="nav-btn" data-target="morph">Slow Loader</button>
    <button class="nav-btn" data-target="blank">Blank Page</button>
  </nav>

  <!-- ===== Main viewport ===== -->
  <main class="viewport">

    <!-- Home / Welcome -->
    <section class="page welcome active" data-page="home">
      <h1>Welcome</h1>
      <p>A small gallery of loading animations. Pick one from the bar above to watch it run — after 20 seconds the screen fades into a quiet night sky.</p>
      <div class="hint-row">
        <span class="arrow"></span>
        <span>Try one from the top</span>
      </div>
    </section>

    <!-- Spinner -->
    <section class="page loader-page" data-page="spinner">
      <div class="loader-host">
        <div class="spinner"></div>
      </div>
      <div class="loader-label">Loading<span class="dots"></span></div>
      <div class="night-scene">
        <div class="moon"></div>
        <div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div>
      </div>
    </section>

    <!-- Dots -->
    <section class="page loader-page" data-page="dots">
      <div class="loader-host">
        <div class="dots-loader"><span></span><span></span><span></span></div>
      </div>
      <div class="loader-label">Just a moment<span class="dots"></span></div>
      <div class="night-scene">
        <div class="moon"></div>
        <div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div>
      </div>
    </section>

    <!-- Pulse -->
    <section class="page loader-page" data-page="pulse">
      <div class="loader-host">
        <div class="pulse-loader">
          <div class="ring"></div>
          <div class="core"></div>
        </div>
      </div>
      <div class="loader-label">Connecting<span class="dots"></span></div>
      <div class="night-scene">
        <div class="moon"></div>
        <div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div>
      </div>
    </section>

    <!-- Bars -->
    <section class="page loader-page" data-page="bars">
      <div class="loader-host">
        <div class="bars-loader"><span></span><span></span><span></span><span></span><span></span></div>
      </div>
      <div class="loader-label">Working on it<span class="dots"></span></div>
      <div class="night-scene">
        <div class="moon"></div>
        <div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div>
      </div>
    </section>

    <!-- Orbit -->
    <section class="page loader-page" data-page="orbit">
      <div class="loader-host">
        <div class="orbit-loader">
          <div class="orbit-track"></div>
          <div class="orbit-arm"><div class="planet"></div></div>
          <div class="core"></div>
        </div>
      </div>
      <div class="loader-label">Hang tight<span class="dots"></span></div>
      <div class="night-scene">
        <div class="moon"></div>
        <div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div>
      </div>
    </section>

    <!-- Morph (slow loader) -->
    <section class="page loader-page" data-page="morph">
      <div class="loader-host">
        <div class="morph-loader"></div>
      </div>
      <div class="loader-label">Taking longer than usual<span class="dots"></span></div>
      <div class="night-scene">
        <div class="moon"></div>
        <div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div>
      </div>
    </section>

    <!-- Blank -->
    <section class="page blank-page" data-page="blank"></section>

  </main>

<script>
  // Per-loader transition delays (ms) before the night scene fades in
  const TRANSITION_MS = {
    spinner: 20000,
    dots:    20000,
    pulse:   20000,
    bars:    20000,
    orbit:   20000,
    morph:   45000,
  };

  const buttons = document.querySelectorAll('.nav-btn');
  const pages = document.querySelectorAll('.page');
  let timer = null;

  function clearMoon() {
    document.querySelectorAll('.night-scene.visible')
      .forEach(n => n.classList.remove('visible'));
  }

  function activate(target) {
    // Toggle pages
    pages.forEach(p => p.classList.toggle('active', p.dataset.page === target));
    // Toggle buttons
    buttons.forEach(b => b.classList.toggle('active', b.dataset.target === target));

    // Reset any running moon transition and start a fresh one for loader pages
    clearMoon();
    if (timer) { clearTimeout(timer); timer = null; }

    if (target in TRANSITION_MS) {
      const activePage = document.querySelector(`.page[data-page="${target}"]`);
      const night = activePage.querySelector('.night-scene');
      timer = setTimeout(() => {
        if (night) night.classList.add('visible');
      }, TRANSITION_MS[target]);
    }
  }

  buttons.forEach(btn => {
    btn.addEventListener('click', () => activate(btn.dataset.target));
  });
</script>
</body>
</html>
