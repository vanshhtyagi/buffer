<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%228%22 stroke-dasharray=%22150 100%22><animateTransform attributeName=%22transform%22 type=%22rotate%22 from=%220 50 50%22 to=%22360 50 50%22 dur=%221s%22 repeatCount=%22indefinite%22/></circle></svg>">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #0a0a0a;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: #e8e8e8;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    transition: background 2s ease;
  }

  /* When the night scene activates, deepen the background */
  body.night {
    background: radial-gradient(ellipse at center, #0c1442 0%, #050714 70%, #02030a 100%);
  }

  /* ===== LOADER SCENE ===== */
  .loader-scene {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    transition: opacity 1.2s ease, visibility 1.2s ease;
    z-index: 2;
  }

  .loader-scene.hidden {
    opacity: 0;
    visibility: hidden;
  }

  .loader-scene::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(80, 80, 200, 0.08), transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(200, 80, 150, 0.06), transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(80, 200, 180, 0.05), transparent 60%);
    animation: drift 20s ease-in-out infinite alternate;
    z-index: -1;
  }

  @keyframes drift {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(30px, -20px) scale(1.1); }
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .spinner {
    width: 64px;
    height: 64px;
    position: relative;
  }

  .spinner::before,
  .spinner::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 3px solid transparent;
  }

  .spinner::before {
    border-top-color: #ffffff;
    border-right-color: rgba(255, 255, 255, 0.3);
    animation: spin 1.2s linear infinite;
  }

  .spinner::after {
    inset: 10px;
    border-top-color: rgba(255, 255, 255, 0.6);
    border-left-color: rgba(255, 255, 255, 0.2);
    animation: spin 0.8s linear infinite reverse;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .status {
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.5px;
    color: rgba(232, 232, 232, 0.85);
    min-height: 20px;
    text-align: center;
  }

  .status .dots::after {
    content: '';
    animation: dots 1.5s steps(4, end) infinite;
  }

  @keyframes dots {
    0%   { content: ''; }
    25%  { content: '.'; }
    50%  { content: '..'; }
    75%  { content: '...'; }
    100% { content: ''; }
  }

  .progress-bar {
    width: 280px;
    height: 4px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }

  .progress-bar::before {
    content: '';
    position: absolute;
    height: 100%;
    width: 40%;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(255, 255, 255, 0.9) 50%,
      transparent 100%
    );
    animation: indeterminate 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }

  @keyframes indeterminate {
    0%   { left: -40%; }
    100% { left: 100%; }
  }

  .hint {
    font-size: 12px;
    color: rgba(232, 232, 232, 0.4);
    margin-top: 8px;
    letter-spacing: 0.3px;
  }

  /* ===== NIGHT SCENE ===== */
  .night-scene {
    position: fixed;
    inset: 0;
    opacity: 0;
    visibility: hidden;
    transition: opacity 2s ease, visibility 2s ease;
    z-index: 1;
  }

  .night-scene.visible {
    opacity: 1;
    visibility: visible;
  }

  /* Moon */
  .moon {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 140px;
    height: 140px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fffbe6 0%, #f5e9b8 40%, #d4c283 75%, #a89868 100%);
    box-shadow:
      0 0 60px rgba(255, 248, 200, 0.4),
      0 0 120px rgba(255, 248, 200, 0.2),
      inset -15px -15px 40px rgba(0, 0, 0, 0.25);
    animation: moonFloat 6s ease-in-out infinite;
  }

  /* Subtle craters */
  .moon::before,
  .moon::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.08);
  }

  .moon::before {
    width: 22px;
    height: 22px;
    top: 30%;
    left: 55%;
    box-shadow:
      -30px 20px 0 -4px rgba(0, 0, 0, 0.07),
      10px 35px 0 -2px rgba(0, 0, 0, 0.06);
  }

  .moon::after {
    width: 14px;
    height: 14px;
    top: 60%;
    left: 30%;
    box-shadow:
      25px -10px 0 -2px rgba(0, 0, 0, 0.06);
  }

  @keyframes moonFloat {
    0%, 100% { transform: translate(-50%, -50%); }
    50%      { transform: translate(-50%, calc(-50% - 10px)); }
  }

  /* Stars */
  .star {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #ffffff;
    border-radius: 50%;
    box-shadow: 0 0 6px 1px rgba(255, 255, 255, 0.8);
    animation: twinkle 2.5s ease-in-out infinite;
  }

  .star::before,
  .star::after {
    content: '';
    position: absolute;
    background: rgba(255, 255, 255, 0.6);
  }

  /* Cross-shape sparkle */
  .star::before {
    width: 16px;
    height: 1px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .star::after {
    width: 1px;
    height: 16px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .star:nth-child(1) { top: 18%; left: 22%; animation-delay: 0s;   }
  .star:nth-child(2) { top: 28%; left: 78%; animation-delay: 0.6s; }
  .star:nth-child(3) { top: 70%; left: 15%; animation-delay: 1.2s; }
  .star:nth-child(4) { top: 80%; left: 72%; animation-delay: 1.8s; }
  .star:nth-child(5) { top: 12%; left: 50%; animation-delay: 0.9s; }

  @keyframes twinkle {
    0%, 100% { opacity: 0.4; transform: scale(0.85); }
    50%      { opacity: 1;   transform: scale(1.15); }
  }
</style>
</head>
<body>

  <!-- Loader scene -->
  <div class="loader-scene" id="loader">
    <div class="container">
      <div class="spinner" aria-hidden="true"></div>
      <div class="status" role="status" aria-live="polite">
        <span id="message">Loading</span><span class="dots"></span>
      </div>
      <div class="progress-bar" aria-hidden="true"></div>
      <div class="hint" id="hint">This may take a moment</div>
    </div>
  </div>

  <!-- Night scene -->
  <div class="night-scene" id="night" aria-hidden="true">
    <div class="moon"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
  </div>

<script>
  const messages = [
    'Loading',
    'Connecting to server',
    'Fetching resources',
    'Almost there',
    'Just a moment',
    'Preparing your experience',
    'Establishing connection',
    'Loading assets',
    'Initializing',
    'Hang tight',
    'Optimizing',
    'Syncing data'
  ];

  const hints = [
    'This may take a moment',
    'Please do not refresh the page',
    'Working on it',
    'Thanks for your patience',
    'Nearly ready',
    'Setting things up'
  ];

  const messageEl = document.getElementById('message');
  const hintEl = document.getElementById('hint');
  messageEl.style.transition = 'opacity 0.25s ease';
  hintEl.style.transition = 'opacity 0.25s ease';

  let i = 0, h = 0;

  const msgInterval = setInterval(() => {
    i = (i + 1) % messages.length;
    messageEl.style.opacity = '0';
    setTimeout(() => {
      messageEl.textContent = messages[i];
      messageEl.style.opacity = '1';
    }, 250);
  }, 3500);

  const hintInterval = setInterval(() => {
    h = (h + 1) % hints.length;
    hintEl.style.opacity = '0';
    setTimeout(() => {
      hintEl.textContent = hints[h];
      hintEl.style.opacity = '1';
    }, 250);
  }, 2000);

  // After 50 seconds, transition to the moon scene
  setTimeout(() => {
    clearInterval(msgInterval);
    clearInterval(hintInterval);

    document.getElementById('loader').classList.add('hidden');
    document.body.classList.add('night');
    const night = document.getElementById('night');
    night.classList.add('visible');
    night.setAttribute('aria-hidden', 'false');
    document.title = 'Goodnight';
  }, 50000);
</script>
</body>
</html>
