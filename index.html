<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%228%22 stroke-dasharray=%22150 100%22><animateTransform attributeName=%22transform%22 type=%22rotate%22 from=%220 50 50%22 to=%22360 50 50%22 dur=%221s%22 repeatCount=%22indefinite%22/></circle></svg>">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #0a0a0a;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: #e8e8e8;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    user-select: none;
  }

  /* Animated gradient background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(80, 80, 200, 0.08), transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(200, 80, 150, 0.06), transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(80, 200, 180, 0.05), transparent 60%);
    animation: drift 20s ease-in-out infinite alternate;
    z-index: 0;
  }

  @keyframes drift {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(30px, -20px) scale(1.1); }
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  /* Spinner */
  .spinner {
    width: 64px;
    height: 64px;
    position: relative;
  }

  .spinner::before,
  .spinner::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 3px solid transparent;
  }

  .spinner::before {
    border-top-color: #ffffff;
    border-right-color: rgba(255, 255, 255, 0.3);
    animation: spin 1.2s linear infinite;
  }

  .spinner::after {
    inset: 10px;
    border-top-color: rgba(255, 255, 255, 0.6);
    border-left-color: rgba(255, 255, 255, 0.2);
    animation: spin 0.8s linear infinite reverse;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Loading text */
  .status {
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.5px;
    color: rgba(232, 232, 232, 0.85);
    min-height: 20px;
    text-align: center;
  }

  .status .dots::after {
    content: '';
    animation: dots 1.5s steps(4, end) infinite;
  }

  @keyframes dots {
    0%   { content: ''; }
    25%  { content: '.'; }
    50%  { content: '..'; }
    75%  { content: '...'; }
    100% { content: ''; }
  }

  /* Progress bar */
  .progress-bar {
    width: 280px;
    height: 4px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }

  .progress-bar::before {
    content: '';
    position: absolute;
    height: 100%;
    width: 40%;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(255, 255, 255, 0.9) 50%,
      transparent 100%
    );
    animation: indeterminate 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }

  @keyframes indeterminate {
    0%   { left: -40%; }
    100% { left: 100%; }
  }

  /* Subtle hint text */
  .hint {
    font-size: 12px;
    color: rgba(232, 232, 232, 0.4);
    margin-top: 8px;
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="spinner" aria-hidden="true"></div>
    <div class="status" role="status" aria-live="polite">
      <span id="message">Loading</span><span class="dots"></span>
    </div>
    <div class="progress-bar" aria-hidden="true"></div>
    <div class="hint" id="hint">This may take a moment</div>
  </div>

<script>
  // Rotate through plausible loading messages to keep it feeling alive
  const messages = [
    'Loading',
    'Connecting to server',
    'Fetching resources',
    'Almost there',
    'Just a moment',
    'Preparing your experience',
    'Establishing connection',
    'Loading assets',
    'Initializing',
    'Hang tight',
    'Optimizing',
    'Syncing data'
  ];

  const hints = [
    'This may take a moment',
    'Please do not refresh the page',
    'Working on it',
    'Thanks for your patience',
    'Nearly ready',
    'Setting things up'
  ];

  const messageEl = document.getElementById('message');
  const hintEl = document.getElementById('hint');
  let i = 0;
  let h = 0;

  setInterval(() => {
    i = (i + 1) % messages.length;
    messageEl.style.opacity = '0';
    setTimeout(() => {
      messageEl.textContent = messages[i];
      messageEl.style.opacity = '1';
    }, 250);
  }, 3500);

  setInterval(() => {
    h = (h + 1) % hints.length;
    hintEl.style.opacity = '0';
    setTimeout(() => {
      hintEl.textContent = hints[h];
      hintEl.style.opacity = '1';
    }, 250);
  }, 5000);

  // Smooth fade transitions
  messageEl.style.transition = 'opacity 0.25s ease';
  hintEl.style.transition = 'opacity 0.25s ease';
</script>
</body>
</html>
